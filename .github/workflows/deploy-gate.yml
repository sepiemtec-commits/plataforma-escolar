# TOKEN 16 — Gate pré-deploy: FULL TESTS
# E2E + segurança + migrações + health. Bloqueia promoção se falhar.
# NÃO inclui carga pesada / endurance.
name: Deploy Gate — Full

on:
  push:
    branches: [master, main]
  workflow_dispatch:
  # Chamável por outros workflows (ex.: release)
  workflow_call:

concurrency:
  group: deploy-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-critical:
    name: FULL TESTS (críticos)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Lint + typecheck + unit
        run: npm run test:quick

      - name: API + integração
        run: npm run test:api && npm run test:integration

      - name: Segurança
        run: npm run test:security

      - name: Migrações / índices (migrate:check)
        run: npm run migrate:check

      - name: Health checks (/health /live /ready /metrics)
        run: npm run healthcheck

      - name: Instalar Chromium (Playwright)
        run: npx playwright install chromium --with-deps

      - name: E2E Playwright
        run: npm run test:e2e:pw
        env:
          CI: 'true'
          ASSINATURA_MODO_DEV: 'true'
          DISABLE_RATE_LIMIT: '1'

      - name: Upload Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-deploy-gate
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 14

  # Job sentinela — falha se full-critical falhar (útil para branch protection)
  deploy-allowed:
    name: Deploy permitido
    runs-on: ubuntu-latest
    needs: [full-critical]
    if: always()
    steps:
      - name: Verificar gate
        run: |
          echo "full-critical=${{ needs.full-critical.result }}"
          if [ "${{ needs.full-critical.result }}" != "success" ]; then
            echo "::error::FULL TESTS falharam — deploy bloqueado"
            exit 1
          fi
          echo "Gate OK — testes críticos passaram; deploy pode seguir (Render/manual)."

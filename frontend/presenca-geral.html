<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadro de Presença</title>
    <link rel="stylesheet" href="styles/painel.css">
    <link rel="stylesheet" href="styles/fonts.css">
</head>
<body>
    <div class="container-principal">
        <main class="main-content presenca-geral-content">
            <div class="header">
                <h1>📋 Quadro de Presença</h1>
                <div class="user-info">
                    <button type="button" class="btn btn-pequeno" id="btnVoltar">← Voltar</button>
                    <button class="btn-logout" id="btnLogout">Sair</button>
                </div>
            </div>

            <div class="formulario" style="max-width: 100%; margin-bottom: 30px;">
                <div class="form-row">
                    <div class="form-group">
                        <label for="filtroData">Data</label>
                        <input type="date" id="filtroData" required>
                    </div>
                    <div class="form-group">
                        <label for="filtroTurma">Turma</label>
                        <select id="filtroTurma">
                            <option value="">Todas as turmas</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="filtroDisciplina">Disciplina</label>
                        <select id="filtroDisciplina">
                            <option value="">Todas</option>
                        </select>
                    </div>
                    <div class="form-group" style="display:flex;align-items:flex-end;">
                        <button type="button" class="btn btn-sucesso" id="btnFiltrar">Atualizar</button>
                    </div>
                </div>
            </div>

            <div id="quadroPresenca">
                <p style="color:#7f8c8d;">Carregando...</p>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/presenca-geral.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VEHO Edu">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

    <title>Ficha de Matrícula — VEHO</title>
    <link rel="stylesheet" href="/styles/relatorios.css">
    <link rel="stylesheet" href="/styles/fonts.css">
</head>
<body class="relatorio-page" data-pagina="ficha-matricula">
    <div class="rel-topbar no-print">
        <div class="rel-topbar-nav">
            <a href="#" class="rel-btn-voltar" id="linkVoltar">← Voltar</a>
        </div>
        <span id="nomeUsuario"></span>
    </div>

    <div class="rel-container">
        <div class="rel-acoes-linha no-print">
            <button type="button" class="rel-btn rel-btn-imprimir" id="btnImprimir">Imprimir</button>
        </div>
        <h1 class="rel-titulo">Ficha de Matrícula</h1>

        <div class="rel-filtros no-print">
            <div>
                <label for="filtroEnsino">Nível de Ensino</label>
                <select id="filtroEnsino"></select>
            </div>
            <div>
                <label for="filtroAno">Ano / Série</label>
                <select id="filtroAno"></select>
            </div>
            <div>
                <label for="filtroTurma">Turma</label>
                <select id="filtroTurma"></select>
            </div>
            <div>
                <label for="selectAluno">Aluno</label>
                <select id="selectAluno"></select>
            </div>
            <button type="button" class="rel-btn rel-btn-primario" id="btnCarregar">Listar</button>
        </div>

        <div id="conteudo"></div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/academico.js"></script>
    <script src="/js/relatorio-pages.js"></script>
    <script src="/js/pwa-register.js"></script>
</body>
</html>

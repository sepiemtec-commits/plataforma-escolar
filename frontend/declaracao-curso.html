<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Declaração de Curso — EdPlus</title>
    <link rel="stylesheet" href="styles/relatorios.css">
    <link rel="stylesheet" href="styles/fonts.css">
</head>
<body class="relatorio-page" data-pagina="declaracao-curso">
    <div class="rel-topbar no-print">
        <div><a href="academico.html">← Acadêmico</a></div>
        <span id="nomeUsuario"></span>
    </div>

    <div class="rel-container">
        <h1 class="rel-titulo" id="tituloDeclaracao">Declaração de Curso</h1>

        <section class="rel-bloco-verificacao no-print" id="blocoVerificacao">
            <h2 class="rel-subtitulo">Verificar autenticidade</h2>
            <p class="rel-verificacao-dica">Digite o código impresso na declaração para confirmar que o documento é autêntico. Disponível a qualquer momento para secretaria, administrador e coordenador.</p>
            <div class="rel-filtros rel-filtros-verificacao">
                <div>
                    <label for="codigoVerificacao">Código da declaração</label>
                    <input type="text" id="codigoVerificacao" placeholder="Ex.: ABC12345" autocomplete="off" spellcheck="false">
                </div>
                <button type="button" class="rel-btn rel-btn-primario" id="btnVerificarCodigo">Verificar</button>
            </div>
            <div id="resultadoVerificacao" aria-live="polite"></div>
        </section>

        <div class="rel-filtros no-print" id="blocoFiltrosDeclaracao">
            <div>
                <label for="filtroEnsino">Nível de Ensino</label>
                <select id="filtroEnsino"></select>
            </div>
            <div>
                <label for="filtroAno">Ano / Série</label>
                <select id="filtroAno"></select>
            </div>
            <div>
                <label for="filtroTurma">Turma</label>
                <select id="filtroTurma"></select>
            </div>
            <div>
                <label for="selectAluno">Aluno</label>
                <select id="selectAluno"></select>
            </div>
            <button type="button" class="rel-btn rel-btn-primario" id="btnCarregar">Listar declarações</button>
            <button type="button" class="rel-btn rel-btn-imprimir" id="btnImprimir">Imprimir</button>
        </div>

        <div id="conteudo"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/academico.js"></script>
    <script src="js/relatorio-pages.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar - Plataforma Educacional</title>
    <link rel="stylesheet" href="styles/login.css">
    <link rel="stylesheet" href="styles/fonts.css">
</head>
<body>
    <div class="container-login">
        <div class="login-box">
            <h1>🎓 Criar Conta</h1>
            <p class="subtitle">Plataforma Educacional</p>

            <form id="formRegistro" class="form-login">
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>

                <div class="form-group">
                    <label for="whatsapp">WhatsApp</label>
                    <input type="tel" id="whatsapp" name="whatsapp" placeholder="+55 11 99999-9999" required>
                </div>

                <div class="form-group">
                    <label for="tipo">Tipo de Usuário</label>
                    <select id="tipo" name="tipo" required>
                        <option value="">Selecione</option>
                        <option value="aluno">Aluno</option>
                        <option value="professor">Professor</option>
                        <option value="responsavel">Responsável</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required>
                </div>

                <div class="form-group">
                    <label for="confirmaSenha">Confirmar Senha</label>
                    <input type="password" id="confirmaSenha" name="confirmaSenha" required>
                </div>

                <button type="submit" class="btn-login">Registrar</button>
            </form>

            <div class="divider">ou</div>

            <a href="index.html" class="btn-registrar">Voltar ao Login</a>

            <div id="mensagemErro" class="erro" style="display: none;"></div>
            <div id="mensagemSucesso" class="sucesso" style="display: none;"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const cpf = document.getElementById('cpf').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const tipo = document.getElementById('tipo').value;
            const senha = document.getElementById('senha').value;
            const confirmaSenha = document.getElementById('confirmaSenha').value;

            if (senha !== confirmaSenha) {
                document.getElementById('mensagemErro').textContent = '❌ Senhas não coincidem';
                document.getElementById('mensagemErro').style.display = 'block';
                return;
            }

            try {
                const resposta = await api.registrar({
                    nome,
                    email,
                    cpf,
                    whatsapp,
                    tipo,
                    senha
                });

                document.getElementById('mensagemSucesso').textContent = 'Registro realizado! Redirecionando...';
                document.getElementById('mensagemSucesso').style.display = 'block';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } catch (erro) {
                document.getElementById('mensagemErro').textContent = '❌ ' + erro.message;
                document.getElementById('mensagemErro').style.display = 'block';
            }
        });
    </script>
</body>
</html>

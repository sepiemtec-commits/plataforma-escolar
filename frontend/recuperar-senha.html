<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEHO — Recuperar senha</title>
    <link rel="stylesheet" href="/styles/login.css">
    <link rel="stylesheet" href="/styles/fonts.css">
</head>
<body>
    <div class="container-login">
        <div class="login-box">
            <h1>VEHO</h1>
            <p class="subtitle">Recuperação de senha</p>

            <form id="formRecuperar" class="form-login">
                <div class="form-group">
                    <label for="email">Email da conta</label>
                    <input type="email" id="email" name="email" required placeholder="usuario@escola.com">
                </div>
                <button type="submit" class="btn-login" id="btnRecuperar">Enviar link</button>
            </form>

            <form id="formRedefinir" class="form-login" style="display:none;margin-top:1.5rem;">
                <div class="form-group">
                    <label for="token">Token</label>
                    <input type="text" id="token" name="token" required>
                </div>
                <div class="form-group">
                    <label for="novaSenha">Nova senha</label>
                    <input type="password" id="novaSenha" name="novaSenha" required minlength="8">
                </div>
                <button type="submit" class="btn-login" id="btnRedefinir">Redefinir senha</button>
            </form>

            <p class="subtitle-login"><a href="index.html">Voltar ao login</a></p>
            <div id="mensagemErro" class="erro" style="display:none;"></div>
            <div id="mensagemSucesso" class="sucesso" style="display:none;"></div>
        </div>
    </div>
    <script src="/js/recuperar-senha.js"></script>
</body>
</html>

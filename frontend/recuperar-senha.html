<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEHO — Recuperar senha</title>
    <link rel="stylesheet" href="/styles/login.css">
    <link rel="stylesheet" href="/styles/fonts.css">
    <link rel="stylesheet" href="/styles/acessibilidade.css">
    <script src="/js/acessibilidade.js"></script>
</head>
<body>
    <div class="container-login">
        <div class="login-box">
            <h1>VEHO</h1>
            <p class="subtitle" id="subtituloSenha">Recuperação de senha</p>

            <form id="formRecuperar" class="form-login">
                <div class="form-group">
                    <label for="email">Email da conta</label>
                    <input type="email" id="email" name="email" required placeholder="usuario@escola.com" autocomplete="username">
                </div>
                <button type="submit" class="btn-login" id="btnRecuperar">Enviar link</button>
            </form>

            <form id="formRedefinir" class="form-login" hidden>
                <p class="subtitle-login">Escolha uma senha nova. O link vale por 1 hora e só funciona uma vez.</p>
                <input type="hidden" id="token" name="token">
                <div class="form-group">
                    <label for="novaSenha">Nova senha</label>
                    <input type="password" id="novaSenha" name="novaSenha" required minlength="8" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmaSenha">Confirmar nova senha</label>
                    <input type="password" id="confirmaSenha" name="confirmaSenha" required minlength="8" autocomplete="new-password">
                </div>
                <button type="submit" class="btn-login" id="btnRedefinir">Salvar nova senha</button>
            </form>

            <p class="subtitle-login"><a href="index.html">Voltar ao login</a></p>
            <div id="mensagemErro" class="erro" style="display:none;"></div>
            <div id="mensagemSucesso" class="sucesso" style="display:none;"></div>
        </div>
    </div>
    <script src="/js/recuperar-senha.js"></script>
</body>
</html>

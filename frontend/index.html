<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VEHO Edu">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

    <title>VEHO - Login</title>
    <link rel="stylesheet" href="/styles/login.css">
    <link rel="stylesheet" href="/styles/fonts.css">
</head>
<body>
    <div class="container-login">
        <div class="login-box">
            <h1>VEHO</h1>
            <p class="subtitle">Gestão escolar</p>

            <form id="loginForm" class="form-login">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="professor@escola.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input 
                        type="password" 
                        id="senha" 
                        name="senha" 
                        placeholder="••••••••"
                        required
                    >
                </div>

                <button type="submit" class="btn-login">Entrar</button>
            </form>

            <p class="subtitle-login">
                <a href="recuperar-senha.html">Esqueci minha senha</a>
            </p>

            <p class="subtitle-login">
                Matrículas e cadastros são realizados pela secretaria escolar.<br>
                <a href="assinar.html">Assinar VEHO para sua escola</a>
                · <a href="termos.html">Termos</a>
                · <a href="privacidade.html">Privacidade</a>
            </p>

            <div id="mensagemErro" class="erro" style="display: none;"></div>
            <div id="mensagemSucesso" class="sucesso" style="display: none;"></div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/login.js"></script>
    <script src="/js/pwa-register.js"></script>
</body>
</html>
